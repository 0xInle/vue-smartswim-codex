      - generic [ref=e105]:
        - article [ref=e106]:
          - paragraph [ref=e107]: Ребенок начал ходить на тренировки с удовольствием. За несколько месяцев появилась уверенность в воде и заметный прогресс в технике.
          - generic [ref=e109]: Марина К.
        - article [ref=e110]:
          - paragraph [ref=e111]: Очень спокойная и профессиональная атмосфера. Тренеры умеют объяснить сложные вещи простым языком и взрослым, и детям.
          - generic [ref=e113]: Алексей П.
        - article [ref=e114]:
          - paragraph [ref=e115]: Нравится, что в школе следят не только за результатом, но и за тем, чтобы тренировки были комфортными и безопасными.
          - generic [ref=e117]: Екатерина Л.
        - article:
          - paragraph: Пришел улучшить технику для любительских стартов. Получил понятный план, внимание к деталям и реальный рост результатов.
          - generic:
            - generic: Игорь С.
        - article:
          - paragraph: Тренировки хорошо структурированы, без хаоса. Видно, что у команды есть система и большой практический опыт.
          - generic:
            - generic: Ольга В.
        - article:
          - paragraph: Порадовал индивидуальный подход. Даже в групповых занятиях тренер замечает ошибки и сразу корректирует технику.
          - generic:
            - generic: Дмитрий Н.
        - article:
          - paragraph: После нескольких недель занятий ребенок перестал бояться глубины. Для нашей семьи это был очень важный шаг.
          - generic:
            - generic: Анна Р.
        - article:
          - paragraph: Красивый процесс обучения без давления. Много внимания дисциплине, технике и мотивации, поэтому хочется продолжать.
          - generic:
            - generic: Светлана М.
        - article:
          - paragraph: Понравилось, что здесь думают о долгом результате, а не просто проводят занятие. Все последовательно и очень понятно.
          - generic:
            - generic: Павел Т.
        - article:
          - paragraph: Сын стал увереннее не только в бассейне, но и в целом. Соревновательная практика дала ему отличную внутреннюю опору.
          - generic:
            - generic: Юлия Б.
        - article:
          - paragraph: Отдельно отмечу организацию сборов и соревнований. Все собрано аккуратно, без лишней суеты и с вниманием к детям.
          - generic:
            - generic: Виктор Е.
        - article:
          - paragraph: Нравится минималистичный, спокойный подход и уважительное общение. Это место, куда действительно приятно возвращаться.
          - generic:
            - generic: Полина А.
        - article:
          - paragraph: Занимаюсь для себя, но прогресс ощущается как у спортивной подготовки. Стало легче дышать, плыть и держать темп.
          - generic:
            - generic: Кирилл Ж.
        - article [ref=e118]:
          - paragraph [ref=e119]: Тренеры умеют поддержать и при этом не снижать планку. Это редкое сочетание, которое очень мотивирует.
          - generic [ref=e121]: Наталья Ф.
        - article [ref=e122]:
          - paragraph [ref=e123]: Одна из самых аккуратных школ, что я видел. Хорошая методика, эстетичная подача и очень сильная тренерская команда.
          - generic [ref=e125]: Роман Д.
